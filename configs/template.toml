# =============================================================================
# LBM-IBM-FSI 求解器配置全量模板
# =============================================================================
# 本文件列出所有可配置参数及其含义，作为编写新配置文件的参考。
# 实际使用时，将本文件复制并按需修改，删除与当前算例无关的节（section）即可。
# 详细物理模型说明请参阅 docs/ 目录下的文档。

# -----------------------------------------------------------------------------
# [simulation] 仿真控制
# -----------------------------------------------------------------------------
[simulation]
n_steps         = 10000       # 总时间步数
dt              = 1.0         # 物理时间步长（格子单位，通常保持 1.0）
lattice_model   = "D2Q9"      # 格子模型："D2Q9"（2D）| "D3Q19" | "D3Q27"（3D）
collision_model = "MRT"       # 碰撞模型："BGK"（单松弛）| "MRT"（多松弛，低粘度更稳定）

# -----------------------------------------------------------------------------
# [fluid] 流体域与边界条件
# -----------------------------------------------------------------------------
[fluid]
nx   = 100      # X 方向格点数
ny   = 100      # Y 方向格点数
nz   = 1        # Z 方向格点数（2D 算例固定为 1）
nu   = 0.01     # 运动粘度（格子单位）；稳定范围约 0.05–0.5，对应 0.5 < τ < 2
rho0 = 1.0      # 初始均匀密度

# 边界条件列表（每个面对应一条，可重复出现多次）
# bc_type 可选值：
#   "bounce_back"          — 半步长反弹，无滑移固壁（2 阶精度）
#   "bounce_back_full_way" — 全步长反弹，无滑移固壁（1 阶精度）
#   "zou_he_velocity"      — Zou-He 速度 BC，规定 ux/uy/uz（进出口速度入口）
#   "zou_he_pressure"      — Zou-He 压力 BC，规定 rho（进出口压力边界）
#   "fully_developed"      — 充分发展出口，零法向梯度（拷贝上游一层 f）
#   "free_outlet"          — 自由出口，与 fully_developed 等价
#   "guo_extrapolation"    — 郭照立非平衡外推格式（Guo 2002）
# face 可选值："west" | "east" | "south" | "north" | "bottom" | "top"
[[fluid.boundary_conditions]]
bc_type = "zou_he_velocity"   # 边界类型
face    = "north"             # 所在面
ux      = 0.1                 # x 方向速度分量（仅 zou_he_velocity 有效）
uy      = 0.0                 # y 方向速度分量（仅 zou_he_velocity 有效）

[[fluid.boundary_conditions]]
bc_type = "bounce_back"
face    = "south"

[[fluid.boundary_conditions]]
bc_type = "bounce_back"
face    = "west"

[[fluid.boundary_conditions]]
bc_type = "bounce_back"
face    = "east"

# -----------------------------------------------------------------------------
# [structure] 柔性结构（Euler-Bernoulli 梁，仅 IBM-FSI 算例需要此节）
# -----------------------------------------------------------------------------
[structure]
young_modulus = 1.0e3    # 杨氏模量（格子单位）
second_moment = 1.0e-6   # 截面惯性矩 I（格子单位⁴）
density       = 1.5      # 结构线密度（格子单位）
area          = 0.01     # 截面面积（格子单位²）
length        = 0.3      # 自然（无应力）长度（格子单位）
n_elements    = 10       # 有限元单元数（越大越精确，计算量越大）

# -----------------------------------------------------------------------------
# [ibm] 浸没边界法（仅含固体或柔性体的算例需要此节）
# -----------------------------------------------------------------------------
[ibm]
geometry     = "filament"    # 几何类型："filament"（丝状体）| "circle"（刚性圆柱）
x0           = 50.0          # 起点 x（丝状体）或圆心 x（圆形），格子单位
y0           = 30.0          # 起点 y（丝状体）或圆心 y（圆形），格子单位
size         = 30.0          # 长度（丝状体）或半径（圆形），格子单位
n_markers    = 30            # 拉格朗日标记点数量
delta_kernel = "four_point"  # Delta 核函数："two_point" | "four_point"

# -----------------------------------------------------------------------------
# [output] 输出控制
# -----------------------------------------------------------------------------
[output]
write_interval    = 500              # 每隔多少步写出一次流场快照（密度场 ρ、速度场 ux/uy）
directory         = "output/case"   # 快照输出目录（相对路径或绝对路径均可）
format            = "npz"           # 输出格式："npz"（NumPy 压缩，默认）| "tecplot_asc"（.dat）| "tecplot_bin"（.plt）
plot_interval     = 2000            # 每隔多少步通过 Python FFI 生成实时云图（需 --features python-ffi 编译）
enable_csv_monitor = false          # 是否每步向 directory/monitor.csv 追加监控量（step, time, ke）
combine_blocks    = false           # MPI 模式下是否由 rank-0 将各分区拼合为全局场后统一写出

# -----------------------------------------------------------------------------
# [python] Python 集成
# -----------------------------------------------------------------------------
[python]
interpreter = "python3"                               # Python 解释器路径或名称
pre_script  = "python/examples/pre_process.py"       # 仿真开始前执行的预处理脚本（接收配置文件路径作为第一个参数）
post_script = "python/examples/plot_solver_output.py" # 仿真结束后执行的后处理脚本（接收输出目录作为第一个参数）
pythonpath  = "python"                               # 追加到 sys.path 的目录，使 lbm_pre/lbm_post 无需安装即可导入

# -----------------------------------------------------------------------------
# [plugins] 自定义插件（不需要时可省略整节）
# -----------------------------------------------------------------------------
[plugins]
boundary = ""   # 自定义边界条件插件名称（空 = 不启用）
mesh     = ""   # 网格处理 / 自适应细化插件名称
motion   = ""   # 运动网格 / 运动固体插件名称（6-DOF 刚体、ALE 等）
flexible = ""   # 替代柔性体求解器插件名称

# -----------------------------------------------------------------------------
# [parallel] OpenMP 并行（不需要时可省略整节）
# -----------------------------------------------------------------------------
[parallel]
omp_num_threads = 0   # OpenMP 线程数；0 = 使用全部 CPU 核心；正整数 = 强制线程数

# -----------------------------------------------------------------------------
# [mpi] MPI 并行域分解（不需要时可省略整节）
# -----------------------------------------------------------------------------
[mpi]
# mode 可选值：
#   "block"       — XY 块分解（nx_blocks × ny_blocks，1D 切片为其特例）
#   "independent" — 每进程独立仿真，无通信（适合参数扫描）
#   "multigrid"   — 嵌套式多重网格（框架预留）
mode      = "block"   # 域分解模式
nx_blocks = 1         # X 方向进程块数（默认 1）
ny_blocks = 0         # Y 方向进程块数（0 = 自动，等于 mpirun -n N 的 N）
nz_blocks = 1         # Z 方向进程块数（3D 扩展预留，2D 仿真设 1）
