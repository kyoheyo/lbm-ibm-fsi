# 速度入口 + 压力出口 + 上下两壁自由出口
# 适用于开放域或射流类问题：西壁规定速度，东壁规定压力（Zou-He 压力），
# 南北两壁施加自由出口（充分发展/零梯度），允许流体在侧向自由流出。
# 此配置中南北壁为非固壁 BC，角节点（SW/SE/NW/NE）的两相邻面均为
# 非固壁 BC，自动跳过角点反弹修正，避免对出口角点施加错误的 u=0 约束。

[simulation]
n_steps        = 25000
dt             = 1.0
lattice_model  = "D2Q9"
collision_model = "MRT"

[fluid]
nx   = 200                     # 通道长度（格点）
ny   = 80                      # 通道高度 H（格点）
nz   = 1
nu   = 0.05                    # 运动粘度（格子单位）；ν = 0.05 → τ = 0.65
rho0 = 1.0

  # 西壁（速度入口）：Zou-He 速度边界条件
  [[fluid.boundary_conditions]]
  bc_type = "zou_he_velocity"
  face    = "west"
  ux      = 0.05               # 入口速度（格子单位）
  uy      = 0.0

  # 东壁（压力出口）：Zou-He 压力边界条件，规定出口参考密度
  [[fluid.boundary_conditions]]
  bc_type = "zou_he_pressure"
  face    = "east"
  rho     = 1.0

  # 南壁（自由出口）：充分发展出口，零法向梯度
  [[fluid.boundary_conditions]]
  bc_type = "free_outlet"
  face    = "south"

  # 北壁（自由出口）：充分发展出口，零法向梯度
  [[fluid.boundary_conditions]]
  bc_type = "free_outlet"
  face    = "north"

[output]
# 每隔 write_interval 步写出一个完整的流场快照文件（密度场 ρ、速度场 ux/uy）。
write_interval = 1000

# 快照输出目录。
directory      = "output/velocity_inlet_pressure_outlet"

# 输出格式：
#   "tecplot_asc" → fluid_NNNNNN.dat  ASCII Tecplot POINT 格式，可用 ParaView/Tecplot 打开。
#                   适合观测 Zou-He 速度入口 + Zou-He 压力出口配置下的流场，
#                   以及南北面自由出口附近的速度分布细节。（★ 本配置已启用）
#   "npz"         → NumPy .npz 压缩归档，Python lbm_post 后处理首选。
#   "tecplot_bin" → 二进制 Tecplot TDV112，文件体积最小。
format         = "tecplot_asc"

# Python FFI 进程内实时绘图（每隔 plot_interval 步生成速度幅值和涡量云图）。
#
# 使用前提：以 --features python-ffi 特性编译：
#   cargo build --release --features python-ffi
# 图像保存至 <directory>/vel_NNNNNN.png 和 vor_NNNNNN.png。
# 未启用 python-ffi 特性时本行被忽略，.dat 快照仍正常输出。
plot_interval  = 5000   # 每 5000 步（5 次 .dat 快照之后）绘制一次云图

# 每步向 CSV 文件追加监控量（step, time, ke），便于观测入口动能演化。
# enable_csv_monitor = true

[python]
# Python 解释器（Windows 通常为 "python"，Linux/macOS 通常为 "python3"）。
interpreter = "python"

# 仿真结束后自动执行的后处理脚本。
# 脚本以 <directory> 为第一个位置参数，读取 .dat 文件并绘制速度云图与流线。
post_script = "python/examples/plot_solver_output.py"

# 无需 pip install 即可导入 lbm_post 的 sys.path 追加目录。
pythonpath  = "python"
