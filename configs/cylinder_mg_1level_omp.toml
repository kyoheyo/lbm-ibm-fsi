# =============================================================================
# 多重网格测试 — 圆柱绕流 · 单层网格 · OpenMP 多核
# =============================================================================
#
# 场景  : 圆柱绕流，IBM-MDF，Re = 100
# 网格  : 单层粗网格，600×100（无细化层）
# 并行  : OpenMP 4线程（omp_num_threads = 4）
#
# 用途  : 与单核版本（cylinder_mg_1level_serial.toml）对比 OpenMP 加速比
#
# 运行：
#   OMP_NUM_THREADS=4 ./lbm-fsi configs/cylinder_mg_1level_omp.toml
#   或直接运行（由 [parallel] 段设置线程数）：
#   ./lbm-fsi configs/cylinder_mg_1level_omp.toml
# =============================================================================

[simulation]
n_steps         = 2000
dt              = 1.0
lattice_model   = "D2Q9"
collision_model = "MRT"

[fluid]
nx   = 600
ny   = 100
nu   = 0.01
rho0 = 1.0

[[fluid.boundary_conditions]]
bc_type = "zou_he_velocity"
face    = "west"
ux      = 0.05
uy      = 0.0

[[fluid.boundary_conditions]]
bc_type = "fully_developed"
face    = "east"

[[fluid.boundary_conditions]]
bc_type = "bounce_back"
face    = "south"

[[fluid.boundary_conditions]]
bc_type = "bounce_back"
face    = "north"

[fsi]
coupling = "ibm"

[ibm]
geometry     = "circle"
x0           = 150.0
y0           = 50.0
size         = 10.0
n_markers    = 64
delta_kernel = "four_point"
method       = "mdf"
n_iter       = 3

[output]
write_interval = 200
directory      = "output/cylinder_mg_1level_omp"
format         = "npz"

[parallel]
omp_num_threads = 4
