# 速度入口 + 三面自由出口（充分发展/零法向梯度）
#
# 适用场景：
#   开放域（远场）模拟 — 西壁规定均匀速度，其余三面均施加充分发展出口，
#   允许流体自由进出东、南、北三个边界，近似无界流场效果。
#   典型应用：孤立障碍物（圆柱）绕流、射流扩散等不含固壁的外流问题。
#
# 已知限制（使用前请注意）：
#   1. 无压力参考点：本配置不包含任何 Zou-He 压力边界条件，
#      域内无固定压力参考；在超长时间积分中可能出现密度（压力）的缓慢漂移。
#      若需要严格的压力参考，请将东壁改为 bc_type = "zou_he_pressure"
#      （参见 configs/velocity_inlet_pressure_outlet.toml）。
#   2. 边界角点处理：BC 施加顺序采用三轮优先级排序
#      （FullyDeveloped → BounceBack → ZouHe/Guo），确保 ZouHe 入口 BC
#      在角节点（SW、NW）处优先生效，不被自由出口 BC 覆盖。
#   3. 南北面反流：若域内出现强回流，南北面自由出口可能出现逆向流入，
#      建议适当扩大 ny 或在入口附近检查流场合理性。

[simulation]
n_steps        = 30000
dt             = 1.0
lattice_model  = "D2Q9"
collision_model = "MRT"

[fluid]
nx   = 300                     # 流向长度（格点）
ny   = 120                     # 展向高度 H（格点）；较大以减小侧边界对核心流的影响
nz   = 1
nu   = 0.05                    # 运动粘度；Re = ux × ny / nu = 0.05 × 120 / 0.05 = 120
rho0 = 1.0

  # 西壁（速度入口）：Zou-He 速度边界条件，均匀来流
  [[fluid.boundary_conditions]]
  bc_type = "zou_he_velocity"
  face    = "west"
  ux      = 0.05               # 来流速度（格子单位）
  uy      = 0.0

  # 东壁（自由出口）：充分发展出口，零法向梯度
  [[fluid.boundary_conditions]]
  bc_type = "fully_developed"
  face    = "east"

  # 南壁（自由出口）：充分发展出口，零法向梯度；允许侧向流出
  [[fluid.boundary_conditions]]
  bc_type = "fully_developed"
  face    = "south"

  # 北壁（自由出口）：充分发展出口，零法向梯度；允许侧向流出
  [[fluid.boundary_conditions]]
  bc_type = "fully_developed"
  face    = "north"

[output]
write_interval = 1000
directory      = "output/velocity_inlet_free_outlet"
format         = "npz"
