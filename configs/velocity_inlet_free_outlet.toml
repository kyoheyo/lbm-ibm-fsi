# 速度入口 + 三面自由出口（开放域）
# 物理模型：西壁规定均匀速度入口，东、南、北三壁均为充分发展自由出口，
# 模拟近似无界的开放流场（外流问题，如孤立障碍物绕流、射流扩散）。
# 注意：无压力参考点，超长时间积分可能出现密度缓慢漂移；
#       若需严格压力参考，请改用 velocity_inlet_pressure_outlet.toml。
# Re = ux·ny / nu = 0.05 × 120 / 0.05 = 120
# 参考配置说明：configs/template.toml

[simulation]
n_steps         = 30000
dt              = 1.0
lattice_model   = "D2Q9"
collision_model = "MRT"

[fluid]
nx   = 300
ny   = 120
nu   = 0.05
rho0 = 1.0

[[fluid.boundary_conditions]]
bc_type = "zou_he_velocity"
face    = "west"
ux      = 0.05
uy      = 0.0

[[fluid.boundary_conditions]]
bc_type = "fully_developed"
face    = "east"

[[fluid.boundary_conditions]]
bc_type = "fully_developed"
face    = "south"

[[fluid.boundary_conditions]]
bc_type = "fully_developed"
face    = "north"

[output]
write_interval = 1000
directory      = "output/velocity_inlet_free_outlet"
format         = "tecplot_asc"

[python]
interpreter = "python"
post_script = "python/examples/plot_solver_output.py"
pythonpath  = "python"
