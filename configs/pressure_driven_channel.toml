# 压力驱动通道流（Poiseuille 流）基准算例
# 入口（西壁）施加略高压力，出口（东壁）施加参考压力，上下两壁为无滑移固壁。
# 稳态时流场收敛至抛物线速度剖面 u(y) = ΔP · y(H − y) / (2νρ)，
# 其中 ΔP = p_in − p_out = (ρ_in − ρ_out) · cs²（cs² = 1/3，格子单位）。
# 最大速度 U_max = ΔP · H² / (8νρ)，雷诺数 Re = U_max · H / ν。

[simulation]
n_steps        = 20000
dt             = 1.0           # 格子时间单位
lattice_model  = "D2Q9"
collision_model = "MRT"        # MRT 在低粘度下更稳定

[fluid]
nx   = 200                     # 通道长度（格点）
ny   = 60                      # 通道高度 H（格点）
nz   = 1
nu   = 0.1                     # 运动粘度（格子单位）；ν = 0.1 → τ = 0.8，稳定
rho0 = 1.0

  # 西壁（入口）：Zou-He 压力边界条件，规定入口密度（对应较高压力）
  [[fluid.boundary_conditions]]
  bc_type = "zou_he_pressure"
  face    = "west"
  rho     = 1.005               # 入口密度（压力正比于 rho × cs²）

  # 东壁（出口）：Zou-He 压力边界条件，规定出口密度（参考压力）
  [[fluid.boundary_conditions]]
  bc_type = "zou_he_pressure"
  face    = "east"
  rho     = 1.0                 # 出口参考密度

  # 南壁（底部固壁）：半步长反弹，无滑移
  [[fluid.boundary_conditions]]
  bc_type = "bounce_back"
  face    = "south"

  # 北壁（顶部固壁）：半步长反弹，无滑移
  [[fluid.boundary_conditions]]
  bc_type = "bounce_back"
  face    = "north"

[output]
# 每隔 write_interval 步写出一个完整的流场快照文件（密度场 ρ、速度场 ux/uy）。
write_interval = 1000

# 快照输出目录。
directory      = "output/pressure_channel"

# 输出格式：
#   "tecplot_asc" → fluid_NNNNNN.dat  ASCII Tecplot POINT 格式，可用 ParaView/Tecplot 打开。
#                   每行对应一个格点，列顺序：x  y  rho  ux  uy。（★ 本配置已启用）
#   "npz"         → NumPy .npz 压缩归档，Python lbm_post 后处理首选。
#   "tecplot_bin" → 二进制 Tecplot TDV112，文件体积最小。
format         = "tecplot_asc"

# Python FFI 进程内实时绘图（每隔 plot_interval 步生成一张速度幅值和涡量云图）。
#
# 使用前提：以 --features python-ffi 特性编译后，本字段才生效：
#   cargo build --release --features python-ffi
# 图像保存至 <directory>/vel_NNNNNN.png 和 vor_NNNNNN.png，不依赖中间 .dat 文件。
# 若未启用 python-ffi 特性，本行被忽略，.dat 快照仍正常输出。
plot_interval  = 5000   # 每 5000 步（5 次 .dat 快照之后）绘制一次云图

# 每步向 CSV 文件追加监控量，适合跟踪收敛历史。
# enable_csv_monitor = true

[python]
# Python 解释器（Windows 通常为 "python"，Linux/macOS 通常为 "python3"）。
interpreter = "python"

# 仿真结束后自动执行的后处理脚本。
# 脚本以 <directory> 为第一个位置参数，读取 .dat 文件并绘制 Poiseuille 剖面。
post_script = "python/examples/plot_solver_output.py"

# 无需 pip install 即可导入 lbm_post 的 sys.path 追加目录。
pythonpath  = "python"
