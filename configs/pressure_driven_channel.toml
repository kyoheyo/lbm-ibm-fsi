# 压力驱动通道流（Poiseuille 流）基准算例
# 入口（西壁）施加略高压力，出口（东壁）施加参考压力，上下两壁为无滑移固壁。
# 稳态时流场收敛至抛物线速度剖面 u(y) = ΔP · y(H − y) / (2νρ)，
# 其中 ΔP = p_in − p_out = (ρ_in − ρ_out) · cs²（cs² = 1/3，格子单位）。
# 最大速度 U_max = ΔP · H² / (8νρ)，雷诺数 Re = U_max · H / ν。

[simulation]
n_steps        = 20000
dt             = 1.0           # 格子时间单位
lattice_model  = "D2Q9"
collision_model = "MRT"        # MRT 在低粘度下更稳定

[fluid]
nx   = 200                     # 通道长度（格点）
ny   = 60                      # 通道高度 H（格点）
nz   = 1
nu   = 0.1                     # 运动粘度（格子单位）；ν = 0.1 → τ = 0.8，稳定
rho0 = 1.0

  # 西壁（入口）：Zou-He 压力边界条件，规定入口密度（对应较高压力）
  [[fluid.boundary_conditions]]
  bc_type = "zou_he_pressure"
  face    = "west"
  rho     = 1.005               # 入口密度（压力正比于 rho × cs²）

  # 东壁（出口）：Zou-He 压力边界条件，规定出口密度（参考压力）
  [[fluid.boundary_conditions]]
  bc_type = "zou_he_pressure"
  face    = "east"
  rho     = 1.0                 # 出口参考密度

  # 南壁（底部固壁）：半步长反弹，无滑移
  [[fluid.boundary_conditions]]
  bc_type = "bounce_back"
  face    = "south"

  # 北壁（顶部固壁）：半步长反弹，无滑移
  [[fluid.boundary_conditions]]
  bc_type = "bounce_back"
  face    = "north"

[output]
# 每隔 write_interval 步写出一个完整的流场快照文件（密度场 ρ、速度场 ux/uy）。
write_interval = 1000

# 快照输出目录。
directory      = "output/pressure_channel"

# 输出格式：
#   "tecplot_asc" → fluid_NNNNNN.dat  ASCII Tecplot POINT 格式，可用 ParaView/Tecplot 打开。
#                   每行对应一个格点，列顺序：x  y  rho  ux  uy。（★ 本配置已启用）
#   "npz"         → NumPy .npz 压缩归档，Python lbm_post 后处理首选。
#   "tecplot_bin" → 二进制 Tecplot TDV112，文件体积最小。
format         = "tecplot_asc"

# Python FFI 进程内实时绘图（每隔 plot_interval 步生成一张速度幅值和涡量云图）。
#
# 使用前提：以 --features python-ffi 特性编译后，本字段才生效：
#   cargo build --release --features python-ffi
# 图像保存至 <directory>/vel_NNNNNN.png 和 vor_NNNNNN.png，不依赖中间 .dat 文件。
# 若未启用 python-ffi 特性，本行被忽略，.dat 快照仍正常输出。
plot_interval  = 5000   # 每 5000 步（5 次 .dat 快照之后）绘制一次云图

# 每步向 CSV 文件追加监控量，适合跟踪收敛历史。
# enable_csv_monitor = true

# MPI 块分解时合并各分区为全局场（rank-0 写出），单进程模式下无效。
# combine_blocks = true

[python]
# Python 解释器（Windows 通常为 "python"，Linux/macOS 通常为 "python3"）。
interpreter = "python"

# 仿真开始前自动执行的预处理脚本（可选）。
# 脚本接收配置文件路径作为第一个位置参数。
# pre_script  = "python/examples/pre_process.py"

# 仿真结束后自动执行的后处理脚本。
# 脚本以 <directory> 为第一个位置参数，读取 .dat 文件并绘制 Poiseuille 剖面。
post_script = "python/examples/plot_solver_output.py"

# 无需 pip install 即可导入 lbm_post 的 sys.path 追加目录。
pythonpath  = "python"

# ---------------------------------------------------------------------------
# [structure] 弹性结构参数（仅含柔性丝状体的 IBM-FSI 算例才需要，此处注释供参考）
# ---------------------------------------------------------------------------
# [structure]
# young_modulus = 1.0e3    # 杨氏模量
# second_moment = 1.0e-6   # 截面惯性矩
# density       = 1.5      # 结构密度
# area          = 0.01     # 截面面积
# length        = 0.3      # 丝状体自然长度（格子单位）
# n_elements    = 10       # 有限元单元数

# ---------------------------------------------------------------------------
# [ibm] 浸没边界法参数（仅含 IBM 固体/柔性体的算例才需要，此处注释供参考）
# ---------------------------------------------------------------------------
# [ibm]
# geometry     = "filament"    # "filament"（丝状体）或 "circle"（刚性圆柱）
# x0           = 50.0          # 起点/圆心 x（格子单位）
# y0           = 30.0          # 起点/圆心 y（格子单位）
# size         = 30.0          # 长度（丝状体）或半径（圆形），格子单位
# n_markers    = 30            # 拉格朗日标记点数量
# delta_kernel = "four_point"  # Delta 核函数："two_point" 或 "four_point"

[plugins]
# 自定义插件（空字符串 = 不启用）。名称仅作提示用途，实际插件逻辑在 Rust 代码中注册。
# boundary = ""   # 自定义边界条件插件（对流出口、NRBC 等）
# mesh     = ""   # 网格处理 / 自适应细化插件
# motion   = ""   # 运动网格 / 运动固体插件（6 自由度刚体、ALE 等）
# flexible = ""   # 替代柔性体求解器插件（Kirchhoff 板、协转梁等）

[parallel]
# OpenMP 线程数（0 = 使用全部 CPU 核心数；正整数 N = 强制使用 N 个线程）。
# omp_num_threads = 0

[mpi]
# MPI 域分解模式：
#   "block"       → XY 块分解（nx_blocks × ny_blocks，1D 切片为其特例）
#   "independent" → 每进程独立仿真，无通信（适合参数扫描）
#   "multigrid"   → 嵌套式多重网格（框架预留）
# mode      = "block"
# nx_blocks = 1    # X 方向进程块数（默认 1）
# ny_blocks = 0    # Y 方向进程块数（0 = 自动，等于 nprocs；需与 mpirun -n N 匹配）
# nz_blocks = 1    # Z 方向进程块数（3D 扩展预留，2D 仿真设 1）
