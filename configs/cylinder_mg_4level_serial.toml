# =============================================================================
# 多重网格测试 — 圆柱绕流 · 四层网格 · 单核
# =============================================================================
#
# 场景  : 圆柱绕流，IBM-MDF，Re = 100
# 网格  : 四层线性嵌套（L0→L1→L2→L3），各层加密比 r=2
# 并行  : 单核（omp_num_threads = 1）
#
# 【坐标约定】
#   [[multigrid.levels]] 的 x_start/x_end/y_start/y_end 均以
#   L0（最粗）根网格格点为基准（即与 IBM x0/y0/size 相同的坐标系）。
#   代码在 run_multigrid_loop 中使用根坐标 × 累积加密比计算细网格尺寸。
#
# 网格层级说明（L0 为最粗，L3 为最细）：
#
#   L0（粗，根节点）: 600×100，根坐标 [0,599]×[0,99]
#       ω₀ = 1/(3·0.01+0.5) ≈ 1.8868
#
#   L1（r=2，父=L0/根节点）:
#       根坐标 [100,280]×[20,80]，累积加密比 c=2
#       细网格尺寸 = (280-100)·2+1 × (80-20)·2+1 = 361×121
#       ω₁ = 2·ω₀/(4-ω₀) ≈ 1.9512
#       L1 本地坐标中圆柱：(150-100)·2=100, (50-20)·2=60
#
#   L2（r=2，父=L1，tree node 1）:
#       根坐标 [140,180]×[40,60]，累积加密比 c=4
#       细网格尺寸 = (180-140)·4+1 × (60-40)·4+1 = 161×81
#       ω₂ = 2·ω₁/(4-ω₁) ≈ 1.9749
#       L2 本地坐标中圆柱：(150-140)·4=40, (50-40)·4=40
#
#   L3（r=2，父=L2，tree node 2）:
#       根坐标 [144,156]×[44,56]，累积加密比 c=8
#       细网格尺寸 = (156-144)·8+1 × (56-44)·8+1 = 97×97
#       ω₃ = 2·ω₂/(4-ω₂) ≈ 1.9875
#       L3 本地坐标中圆柱中心：(150-144)·8=48, (50-44)·8=48
#       IBM 分配到 L3（圆柱 bbox [145,155]×[45,55] 完全在 L3 内）
#
# 物理加密倍率：L3 细格间距 = L0 格间距 / (2³) = 1/8
# IBM 力自动施加于包含圆柱的最细网格层（圆柱 bbox [140,160]×[40,60] 完全在 L2 内，
# 因此 IBM 分配到 L2；L3 不含完整圆柱故不分配）。
# 标记点坐标从粗网格（根坐标）自动缩放到对应细层本地坐标，ds 同步乘以 cum_scale。
# 固体 BB/IBB 标记由代码自动映射到各细层本地坐标。
#
# 【坐标约定】IBM x0/y0/size（及 mesh_file 中的坐标）均以 L0 根网格格点为单位。
#
# 运行：
#   ./lbm-fsi configs/cylinder_mg_4level_serial.toml
# =============================================================================

[simulation]
n_steps         = 2000
dt              = 1.0
lattice_model   = "D2Q9"
collision_model = "MRT"

[fluid]
nx   = 600
ny   = 100
nu   = 0.01
rho0 = 1.0

[[fluid.boundary_conditions]]
bc_type = "zou_he_velocity"
face    = "west"
ux      = 0.05
uy      = 0.0

[[fluid.boundary_conditions]]
bc_type = "fully_developed"
face    = "east"

[[fluid.boundary_conditions]]
bc_type = "bounce_back"
face    = "south"

[[fluid.boundary_conditions]]
bc_type = "bounce_back"
face    = "north"

[fsi]
coupling = "ibm"

[ibm]
geometry     = "circle"
x0           = 150.0
y0           = 50.0
size         = 10.0
n_markers    = 64
delta_kernel = "four_point"
method       = "mdf"
n_iter       = 3

[output]
write_interval = 200
directory      = "output/cylinder_mg_4level_serial"
format         = "npz"

[parallel]
omp_num_threads = 1

# -----------------------------------------------------------------------------
# 多重网格配置（4层，线性链）
# parent_level = -1 表示自动取上一层为父（线性链默认行为）
# -----------------------------------------------------------------------------
[multigrid]
enabled      = true
fringe_width = 2

# L1：覆盖圆柱及近尾迹，父=L0
# 细网格尺寸 361×121
[[multigrid.levels]]
x_start      = 100
x_end        = 280
y_start      = 20
y_end        = 80
refine_ratio = 2
parent_level = 0    # 父 = L0 根节点

# L2：聚焦圆柱周围，父=L1，根坐标 [140,180]×[40,60]
# 细网格尺寸 = (180-140)·4+1 × (60-40)·4+1 = 161×81
[[multigrid.levels]]
x_start      = 140
x_end        = 180
y_start      = 40
y_end        = 60
refine_ratio = 2
parent_level = 1    # 父 = L1（tree node 1）

# L3：最细层，紧贴圆柱表面，父=L2，根坐标 [144,156]×[44,56]
# 细网格尺寸 = (156-144)·8+1 × (56-44)·8+1 = 97×97
# IBM 分配到 L3（圆柱 bbox [145,155]×[45,55] 完全在 L3 内）
[[multigrid.levels]]
x_start      = 144
x_end        = 156
y_start      = 44
y_end        = 56
refine_ratio = 2
parent_level = 2    # 父 = L2（tree node 2）
