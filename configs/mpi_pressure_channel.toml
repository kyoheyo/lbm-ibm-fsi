# =============================================================================
# MPI 功能展示算例：压力驱动通道流（Poiseuille 流）
# =============================================================================
#
# 物理模型
# --------
# 矩形通道（200 × 60 格），西壁（入口）规定高压 ρ_in = 1.005，
# 东壁（出口）规定参考压力 ρ_out = 1.0，上下两壁无滑移（BounceBack）。
# 稳态时速度剖面收敛至 Poiseuille 抛物线解：
#   u(y) = ΔP·y(H−y) / (2νρ)
# 其中 ΔP = (ρ_in − ρ_out)·cs²  (cs² = 1/3)，H = ny - 2（物理通道宽）
#
# MPI 并行配置
# ------------
# 模式：1D Y 切片（nx_blocks=1, ny_blocks=4）
#   全局网格 200×60 按 Y 方向切分为 4 份，每进程持有 200×15 物理行
#   加 2 行幽灵行（用于进程间 Halo 通信），实际本地 ny = 17。
#
# 运行命令示例（需 ENABLE_MPI=ON 编译 + MPI 环境）：
#   mpirun -n 4 ./orchestrator/target/debug/orchestrator configs/mpi_pressure_channel.toml
#
# 合并输出
# --------
# combine_blocks = true  → rank-0 在每个写出步将 4 个分区拼合为全局场后统一写出，
# 结果与单进程计算完全一致（分区边界无任何物理异常）。
#
# 验证方法
# --------
# 运行完成后，比较：
#   output/mpi_channel/fluid_*.npz   （MPI 合并输出）
#   output/pressure_channel/fluid_*.npz（单进程输出，使用 pressure_driven_channel.toml）
# 两者的速度剖面应高度吻合（最大误差 < 1e-8）。
#
# 参考：
#   docs/MPI并行详解.md §1-3（域分解布局与 Halo 通信）
#   configs/template.toml        （所有可用参数说明）
# =============================================================================

[simulation]
n_steps         = 20000
dt              = 1.0
lattice_model   = "D2Q9"
collision_model = "MRT"

# -----------------------------------------------------------------------------
# 流体域：与 pressure_driven_channel.toml 完全相同，便于对比验证
# -----------------------------------------------------------------------------
[fluid]
nx   = 200
ny   = 60
nu   = 0.1
rho0 = 1.0

# 入口：规定较高密度（压力）
[[fluid.boundary_conditions]]
bc_type = "zou_he_pressure"
face    = "west"
rho     = 1.005

# 出口：规定参考密度（背压）
[[fluid.boundary_conditions]]
bc_type = "zou_he_pressure"
face    = "east"
rho     = 1.0

# 南壁（下壁）：无滑移固壁
# MPI 模式：仅 rank-0（y_start=0 的进程）注册此条件
[[fluid.boundary_conditions]]
bc_type = "bounce_back"
face    = "south"

# 北壁（上壁）：无滑移固壁
# MPI 模式：仅 rank-3（y_end=ny 的进程）注册此条件
[[fluid.boundary_conditions]]
bc_type = "bounce_back"
face    = "north"

# -----------------------------------------------------------------------------
# 输出控制
# combine_blocks = true  → rank-0 在每个写出步将所有分区拼合后统一写出全局场，
#                           输出文件与单进程完全一致，便于直接使用现有后处理脚本。
# combine_blocks = false → 各 rank 独立写出分区数据到 rank_N/ 子目录，
#                           可通过 python/examples/combine_blocks.py 手动拼合。
# -----------------------------------------------------------------------------
[output]
write_interval  = 2000
directory       = "output/mpi_channel"
format          = "npz"
combine_blocks  = true

# -----------------------------------------------------------------------------
# MPI 并行域分解（核心配置）
# -----------------------------------------------------------------------------
[mpi]
# 模式说明：
#   "block"  — 将全局网格切分为 nx_blocks × ny_blocks 个矩形块，
#              每个 MPI 进程负责一个块（1D 切片是 2D 切分的特例）。
#   1D Y 切片（nx_blocks=1）：沿 Y 方向等分，每进程持有全宽的水平条带。
#              适合通道流、Poiseuille 流等 X 方向较长的算例。
mode      = "block"
nx_blocks = 1   # X 方向不切分（保持全宽）
ny_blocks = 4   # Y 方向切为 4 份 → 需 mpirun -n 4

# ny_blocks = 0 时自动等于 mpirun 指定的进程数（-n N），
# 以下注释为几种常见配置参考：
# ny_blocks = 2   # mpirun -n 2
# ny_blocks = 8   # mpirun -n 8
