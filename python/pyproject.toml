[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lbm-ibm-fsi"
version = "0.1.0"
description = "Python pre/post-processing for the LBM+IBM+FSI solver"
requires-python = ">=3.11"
dependencies = [
    "gmsh>=4.11",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lbm_pre*", "lbm_post*"]
